[project]
name = "phonegativerelativeprobabilities"
version = "0.1.1"
requires-python = ">=3.11.2"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib",
    "numpy",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonegativerelativeprobabilities"]
