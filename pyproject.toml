[project]
name = "phonegativerelativeprobabilities"
version = "0.1.0"
requires-python = ">=3.11.2"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonegativerelativeprobabilities"]
